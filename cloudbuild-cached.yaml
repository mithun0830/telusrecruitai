# Optimized Cloud Build configuration with advanced caching
options:
  # Use faster machine type for quicker builds
  machineType: 'E2_HIGHCPU_8'
  
  # Enable Docker BuildKit for advanced caching
  env:
    - 'DOCKER_BUILDKIT=1'
    - 'BUILDKIT_PROGRESS=plain'
  
  # Increase disk size for caching
  diskSizeGb: 100
  
  # Set timeout for build process
  timeout: '1200s'  # 20 minutes max

# Substitution variables for flexibility
substitutions:
  _IMAGE_NAME: 'telusrecruitai'
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'telusrecruitai'
  _PROJECT_ID: 'telusrecruitai-468907'

steps:
  # Step 1: Pull previous image for layer caching
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔄 Pulling latest image for layer caching..."
        docker pull gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest || {
          echo "⚠️ No previous image found for caching. Building from scratch..."
          exit 0
        }
        echo "✅ Cache image pulled successfully"

  # Step 2: Build with advanced caching
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-cached'
    env:
      - 'DOCKER_BUILDKIT=1'
      - 'BUILDKIT_PROGRESS=plain'
    args: [
      'build',
      '--file', 'Dockerfile.optimized',
      '--cache-from', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest',
      '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
      '--build-arg', 'NODE_ENV=production',
      '--tag', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest',
      '--tag', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:$BUILD_ID',
      '.'
    ]
    waitFor: ['pull-cache']

  # Step 3: Push the container image to GCR with cache metadata
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: [
      'push', 
      '--all-tags',
      'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}'
    ]
    waitFor: ['build-cached']

  # Step 4: Deploy to Cloud Run with optimized configuration
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-service'
    args: [
      'run', 'deploy', '${_SERVICE_NAME}',
      '--image', 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--service-account', 'cloud-run-deployer@${_PROJECT_ID}.iam.gserviceaccount.com',
      '--port', '3000',
      '--memory', '512Mi',
      '--cpu', '1',
      '--concurrency', '80',
      '--max-instances', '10',
      '--timeout', '300',
      '--set-env-vars', 'NODE_ENV=production',
      '--project', '${_PROJECT_ID}',
      '--quiet'
    ]
    waitFor: ['push-image']

# Images to be pushed to registry
images:
  - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:latest'
  - 'gcr.io/${_PROJECT_ID}/${_IMAGE_NAME}:$BUILD_ID'

# Logging configuration
logsBucket: 'gs://telus-build-logs'

# Build tags for organization
tags:
  - 'telusrecruitai'
  - 'frontend'
  - 'cached-build'
  - 'optimized'
